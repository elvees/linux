%YAML 1.2
---
$id: http://devicetree.org/schemas/misc/heater-gpio.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Heater controlled via GPIO lines

maintainers:
  - Oleg Ivanov <oaivanov@elvees.com>

properties:
  compatible:
    enum:
      - heater-gpio

  gpios:
    maxItems: 1
    description: GPIO used to control heater.

required:
  - compatible

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    heater-gpio {
      compatible = "heater-gpio";
      gpios = <&gpio1d 4 GPIO_ACTIVE_HIGH>;
    };
